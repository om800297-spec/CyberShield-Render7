<div class="premium-result result"><div class="risk-card"><div class="risk-label">RISK SCORE</div><div class="risk-number">{{ result.score }}</div><div class="risk-outof">out of 100</div><div class="risk-badge">{{ result.level }}</div><div class="category">{{ result.category }}</div></div><div class="result-copy"><div class="section-tag">EXPLAINABLE RESULT</div><h2>Risk indicators found</h2><div class="reason-grid">{% for r in result.reasons %}<div class="reason">⚠️ <span>{{ r }}</span></div>{% endfor %}</div><div class="recommendation"><b>🛡️ Safety action</b><p>{{ result.recommendation }}</p></div></div></div>
